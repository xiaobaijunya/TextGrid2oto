name: 打包并发布

# 触发方式：仅手动触发（Actions → Run workflow），填写版本号（如 1.2.3）
#   → 自动创建并推送 tag v1.2.3 → 双平台打包 → 发布 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.2.3，将自动创建 tag v1.2.3）'
        required: true
        type: string

# 创建 tag 与发布 Release 需要写权限
permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  # 模型（约 244MB）不打包进安装包，由用户自行下载
  MODEL_RELEASE_URL: https://github.com/xiaobaijunya/TextGrid2oto/releases/tag/v0.1.0

jobs:
  # ── 1. 解析版本号，必要时自动创建 tag ──────────────────────
  prepare:
    name: 准备版本与 tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: 检出代码（需完整历史以便创建 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::版本号不能为空"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION  →  tag：v$VERSION"

      - name: 自动创建并推送 tag
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在，请更换版本号"
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ 已创建并推送 tag：$TAG"

      - name: 创建 Release（先建好，供各平台追加上传）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: TextGrid2oto ${{ steps.resolve.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## TextGrid2oto ${{ steps.resolve.outputs.version }}

            ### ⚠️ 使用前请先下载模型（安装包内不含模型）
            由于 ONNX 模型体积过大（约 244 MB），**不随安装包一起分发**，请自行下载：

            👉 **模型下载：** ${{ env.MODEL_RELEASE_URL }}

            解压后把 `HubertFA_model` 文件夹放到程序根目录（与可执行文件同级），
            目录层级需为 `HubertFA_model/<模型名>/model.onnx`。

            ### 📥 下载说明

            | 平台 | 文件 | 解压后运行 |
            | --- | --- | --- |
            | Windows | `TextGrid2oto-windows-${{ steps.resolve.outputs.version }}.zip` | `TextGrid2oto/TextGrid2oto.exe` |
            | macOS | `TextGrid2oto-macos-${{ steps.resolve.outputs.version }}.zip` | `TextGrid2oto.app` |

            > 请**整体解压**后使用，不要只单独拷贝可执行文件。

            **构建环境：** Python ${{ env.PYTHON_VERSION }} · GitHub Actions 自动构建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Windows 打包 ───────────────────────────────────────
  build-windows:
    name: Windows 打包
    needs: prepare
    runs-on: windows-latest
    env:
      # Windows runner 默认 stdout 为 cp1252，打印中文路径会 UnicodeEncodeError。
      # 开启 UTF-8 模式，保证 PyInstaller / 各脚本的中文输出正常。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-wxui.txt
          pip install pyinstaller

      - name: 写入版本号到 i18n
        shell: pwsh
        run: python scripts/stamp_version.py "${{ needs.prepare.outputs.version }}"

      - name: 打包（PyInstaller）
        shell: pwsh
        run: pyinstaller --clean --noconfirm GUI.spec

      - name: 打包为 zip
        shell: pwsh
        run: |
          $zip = "TextGrid2oto-windows-${{ needs.prepare.outputs.version }}.zip"
          Compress-Archive -Path dist/TextGrid2oto/* -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: TextGrid2oto-windows-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. macOS 打包 ─────────────────────────────────────────
  build-macos:
    name: macOS 打包
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-wxui.txt
          pip install pyinstaller

      - name: 写入版本号到 i18n
        run: python scripts/stamp_version.py "${{ needs.prepare.outputs.version }}"

      - name: 打包（PyInstaller）
        run: pyinstaller --clean --noconfirm GUI-macos.spec

      - name: 打包为 zip
        run: |
          ditto -c -k --keepParent "dist/TextGrid2oto.app" \
            "TextGrid2oto-macos-${{ needs.prepare.outputs.version }}.zip"
          ls -lh TextGrid2oto-macos-*.zip

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: TextGrid2oto-macos-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. 收尾：全部构建结束后，重写 Release 描述 ──────────────
  # 前面的打包任务在「上传资产」时也会更新 Release，可能把描述覆盖掉。
  # 这里等所有构建结束，再用同一段文案把描述重写一遍，确保最终展示完整。
  finalize:
    name: 重写 Release 描述
    needs: [prepare, build-windows, build-macos]
    # 即使某个平台构建失败，也尽量把描述补上；但 prepare 失败时无 tag，直接跳过
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 重写 Release 描述
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: TextGrid2oto ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## TextGrid2oto ${{ needs.prepare.outputs.version }}

            ### ⚠️ 使用前请先下载模型（安装包内不含模型）
            由于 ONNX 模型体积过大（约 244 MB），**不随安装包一起分发**，请自行下载：

            👉 **模型下载：** ${{ env.MODEL_RELEASE_URL }}

            解压后把 `HubertFA_model` 文件夹放到程序根目录（与可执行文件同级），
            目录层级需为 `HubertFA_model/<模型名>/model.onnx`。

            ### 📥 下载说明

            | 平台 | 文件 | 解压后运行 |
            | --- | --- | --- |
            | Windows | `TextGrid2oto-windows-${{ needs.prepare.outputs.version }}.zip` | `TextGrid2oto/TextGrid2oto.exe` |
            | macOS | `TextGrid2oto-macos-${{ needs.prepare.outputs.version }}.zip` | `TextGrid2oto.app` |

            > 请**整体解压**后使用，不要只单独拷贝可执行文件。

            **构建环境：** Python ${{ env.PYTHON_VERSION }} · GitHub Actions 自动构建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

